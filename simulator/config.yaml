# ---------------------------------------------------------
# 시뮬레이터 + 데이터 생성 설정 v2
# ---------------------------------------------------------
# 변경 요지:
#   - 페르소나마다 narrow 한 cat_L3 + price_tier 조합 부여 → 페르소나 간 명확한 차별화
#   - 새 필드: cat_L3_pool, price_tiers (prepare_hm_data.py 가 사용)
#   - 구 필드(match_field, match_values, price_sensitivity)도 유지 → simulator.py 호환
#
# H&M data 의 실제 cat_L3 분포:
#   Garment Upper body 20506  (tier 균일 분포)
#   Garment Lower body  9439  (high 47%)
#   Garment Full body   6506  (high 56%)
#   Accessories         4505  (low 73%)
#   Underwear           3508  (low+med 90%)
#   Swimwear            1958
#   Shoes               1845  (high 58%)
#   Socks & Tights       927  (low 95%)
#   Nightwear            687

api:
  log_endpoint: "http://api-server:8000/api/log"

persona_ratios:
  "트렌드세터": 0.15
  "실용주의자": 0.25
  "가성비추구": 0.25
  "브랜드충성": 0.15
  "충동구매":   0.10
  "신중탐색":   0.10

persona_configs:
  "트렌드세터":
    cat_L3_pool: ["Garment Upper body"]
    price_tiers: ["high"]
    match_field: "category_L3"
    match_values: ["Garment Upper body"]
    view_to_cart: 0.15
    cart_to_purchase: 0.40
    search_prob: 0.60
    price_sensitivity: "low"
    p_core: 0.25  # 트렌드 탐색형 — core 비중 낮음

  "실용주의자":
    cat_L3_pool: ["Underwear", "Socks & Tights"]
    price_tiers: ["low", "medium"]
    match_field: "category_L3"
    match_values: ["Underwear", "Socks & Tights"]
    view_to_cart: 0.08
    cart_to_purchase: 0.50
    search_prob: 0.50
    price_sensitivity: "medium"
    p_core: 0.55  # 양말/속옷 단골 — core 반복 (v8a 설정 유지)

  "가성비추구":
    cat_L3_pool: ["Garment Upper body"]
    price_tiers: ["low"]
    match_field: "category_L3"
    match_values: ["Garment Upper body"]
    view_to_cart: 0.10
    cart_to_purchase: 0.50
    search_prob: 0.70
    price_sensitivity: "high"
    p_core: 0.40  # 검증된 가성비 아이템 재구매

  "브랜드충성":
    cat_L3_pool: ["Garment Full body", "Garment Lower body"]
    price_tiers: ["high"]
    match_field: "category_L3"
    match_values: ["Garment Full body", "Garment Lower body"]
    view_to_cart: 0.12
    cart_to_purchase: 0.45
    search_prob: 0.30
    price_sensitivity: "low"
    p_core: 0.55  # 한 브랜드 안에서 반복 (v8a 설정 유지)

  "충동구매":
    cat_L3_pool: ["Accessories", "Swimwear"]
    price_tiers: ["low", "medium"]
    match_field: "category_L3"
    match_values: ["Accessories", "Swimwear"]
    view_to_cart: 0.20
    cart_to_purchase: 0.30
    search_prob: 0.20
    price_sensitivity: "high"
    p_core: 0.25  # 충동적 — core 비중 낮음

  "신중탐색":
    cat_L3_pool: ["Shoes", "Nightwear"]
    price_tiers: ["high", "medium"]
    match_field: "category_L3"
    match_values: ["Shoes", "Nightwear"]
    view_to_cart: 0.05
    cart_to_purchase: 0.20
    search_prob: 0.80
    price_sensitivity: "low"
    p_core: 0.35  # 신중하지만 한번 결정 후 반복
