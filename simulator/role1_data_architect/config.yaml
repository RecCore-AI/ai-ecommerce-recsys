# ---------------------------------------------------------
# 시뮬레이터 동작 설정 (하드코딩 금지 요구사항 충족)
# ---------------------------------------------------------

# [역할 4 담당자에게] 엔드포인트 합의 후 아래 값을 수정
api:
  log_endpoint: "http://api-server:8000/api/log"

# 트래픽 분배 비율 (현실적인 고객 분포)
persona_ratios:
  "트렌드세터": 0.15
  "실용주의자": 0.25
  "가성비추구": 0.25
  "브랜드충성": 0.15
  "충동구매":   0.10
  "신중탐색":   0.10

# 페르소나별 상세 행동 확률 및 선호 타겟
# view_to_cart    : 한 번의 트래픽이 'cart' 또는 'purchase'로 기록될 확률
# cart_to_purchase: 위 cart 중 'purchase'로 한 번 더 진행될 확률
# search_prob     : 세션 시작 시 search 이벤트를 먼저 발생시킬 확률
# 결과적으로 실제 CVR ≈ view_to_cart × cart_to_purchase
# price_sensitivity: 상품 선택 시 가격대 필터 기준
#   high   → price_tier = low 상품 우선
#   medium → 가격 필터 없음 (전체)
#   low    → price_tier = medium/high 상품 우선
persona_configs:
  "트렌드세터":
    view_to_cart: 0.15        # 15% 가 cart 단계 진입
    cart_to_purchase: 0.40    # 그 중 40% 가 구매 → 실제 CVR ≈ 6%
    target_category: "Jeans"
    search_prob: 0.60         # 트렌드 탐색 성향 → 검색 빈도 높음
    price_sensitivity: "medium"
  "실용주의자":
    view_to_cart: 0.08
    cart_to_purchase: 0.50    # CVR ≈ 4%
    target_category: "Basic"
    search_prob: 0.50
    price_sensitivity: "medium"
  "가성비추구":
    view_to_cart: 0.10
    cart_to_purchase: 0.50    # CVR ≈ 5%
    target_category: "Sale"
    search_prob: 0.70         # 가격 비교를 위해 검색 빈도 매우 높음
    price_sensitivity: "high"
  "브랜드충성":
    view_to_cart: 0.12
    cart_to_purchase: 0.45    # CVR ≈ 5.4%
    target_category: "Premium"
    search_prob: 0.30         # 특정 브랜드 직접 접근 → 검색 빈도 낮음
    price_sensitivity: "low"
  "충동구매":
    view_to_cart: 0.20
    cart_to_purchase: 0.30    # CVR ≈ 6%
    target_category: "Accessories"
    search_prob: 0.20         # 추천/배너 클릭 중심 → 검색 빈도 낮음
    price_sensitivity: "medium"
  "신중탐색":
    view_to_cart: 0.05
    cart_to_purchase: 0.20    # CVR ≈ 1%
    target_category: "All"
    search_prob: 0.80         # 꼼꼼하게 검색 후 탐색 → 검색 빈도 최고
    price_sensitivity: "high"
